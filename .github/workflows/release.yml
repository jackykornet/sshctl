name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          stem="sshctl_${version}_${GOOS}_${GOARCH}"
          mkdir -p dist
          binary="dist/sshctl"
          if [ "$GOOS" = windows ]; then
            binary="${binary}.exe"
          fi
          go build -trimpath -ldflags='-s -w' -o "$binary" ./cmd/sshctl
          if [ "$GOOS" = windows ]; then
            (cd dist && zip "${stem}.zip" "$(basename "$binary")")
          else
            tar -C dist -czf "dist/${stem}.tar.gz" "$(basename "$binary")"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sshctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/sshctl_*

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and attach downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
